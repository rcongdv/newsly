name: Daily Email Cron

on:
  schedule:
    # 6:00am PST = 14:00 UTC
    - cron: "00 14 * * *"
    # 1:30pm PST = 21:30 UTC
    - cron: "30 21 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email send
        run: |
          if [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then
            PERIOD="afternoon"
          else
            PERIOD="morning"
          fi
          curl -X POST "https://newsly.fly.dev/api/v1/email/send?period=${PERIOD}" \
            --fail \
            --silent \
            --show-error
